<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#007AFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0051D5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="footGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8E8E8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background rounded square -->
  <rect width="1024" height="1024" rx="180" fill="url(#bgGradient)"/>
  
  <!-- Foot outline (simplified) -->
  <g transform="translate(512, 512)">
    <!-- Foot shape -->
    <path d="M -120,-180 
             C -120,-180 -140,-160 -140,-120
             L -140,80
             C -140,120 -120,160 -80,180
             L 80,180
             C 120,160 140,120 140,80
             L 140,-120
             C 140,-160 120,-180 80,-180
             Z" 
          fill="url(#footGradient)" 
          stroke="#FFFFFF" 
          stroke-width="8"/>
    
    <!-- Toes (5 circles) -->
    <circle cx="-80" cy="-200" r="28" fill="url(#footGradient)" stroke="#FFFFFF" stroke-width="6"/>
    <circle cx="-40" cy="-220" r="32" fill="url(#footGradient)" stroke="#FFFFFF" stroke-width="6"/>
    <circle cx="0" cy="-230" r="34" fill="url(#footGradient)" stroke="#FFFFFF" stroke-width="6"/>
    <circle cx="40" cy="-220" r="30" fill="url(#footGradient)" stroke="#FFFFFF" stroke-width="6"/>
    <circle cx="80" cy="-200" r="26" fill="url(#footGradient)" stroke="#FFFFFF" stroke-width="6"/>
    
    <!-- Camera lens icon overlay -->
    <g transform="translate(0, 20)">
      <!-- Outer lens ring -->
      <circle cx="0" cy="0" r="80" fill="none" stroke="#007AFF" stroke-width="12" opacity="0.8"/>
      <!-- Inner lens -->
      <circle cx="0" cy="0" r="50" fill="none" stroke="#007AFF" stroke-width="8" opacity="0.6"/>
      <!-- Center dot -->
      <circle cx="0" cy="0" r="15" fill="#007AFF" opacity="0.9"/>
      
      <!-- Lens reflection -->
      <path d="M -30,-30 L -15,-15" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
    </g>
    
    <!-- Measurement marks -->
    <line x1="-160" y1="-100" x2="-160" y2="100" stroke="#FFFFFF" stroke-width="4" opacity="0.6"/>
    <line x1="-170" y1="-100" x2="-150" y2="-100" stroke="#FFFFFF" stroke-width="4" opacity="0.6"/>
    <line x1="-170" y1="0" x2="-150" y2="0" stroke="#FFFFFF" stroke-width="4" opacity="0.6"/>
    <line x1="-170" y1="100" x2="-150" y2="100" stroke="#FFFFFF" stroke-width="4" opacity="0.6"/>
  </g>
</svg>
