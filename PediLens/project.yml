name: PediLens
options:
  bundleIdPrefix: com.pedilens
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
  
settings:
  base:
    PRODUCT_NAME: PediLens
    PRODUCT_BUNDLE_IDENTIFIER: com.pedilens.app
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
    SWIFT_EMIT_LOC_STRINGS: YES
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: PediLens/Info.plist
    CODE_SIGN_ENTITLEMENTS: PediLens/PediLens.entitlements
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    SWIFT_ENABLE_EMIT_CONST_VALUES: NO

targets:
  PediLens:
    type: application
    platform: iOS
    sources:
      - path: PediLens
        excludes:
          - "*.md"
          - "SETUP_INSTRUCTIONS.md"
          - "README.md"
    resources:
      - path: PediLens/Resources
        type: folder
    settings:
      base:
        INFOPLIST_FILE: PediLens/Info.plist
        CODE_SIGN_ENTITLEMENTS: PediLens/PediLens.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.pedilens.app
        SWIFT_EMIT_MODULE_INTERFACE: NO
    dependencies:
      - sdk: CoreData.framework
      - sdk: CloudKit.framework
      - sdk: Security.framework
      - sdk: LocalAuthentication.framework
      - sdk: CoreLocation.framework
      - sdk: AVFoundation.framework
      - sdk: Vision.framework
      - sdk: CoreML.framework
      - sdk: PDFKit.framework
      - sdk: CryptoKit.framework
    preBuildScripts: []
    postBuildScripts: []
    
  PediLensTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PediLensTests
    dependencies:
      - target: PediLens
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pedilens.app.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PediLens.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/PediLens"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_INSTALL_OBJC_HEADER: NO
        SWIFT_OBJC_INTERFACE_HEADER_NAME: ""
        SWIFT_EMIT_MODULE_INTERFACE: NO

schemes:
  PediLens:
    build:
      targets:
        PediLens: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PediLensTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
